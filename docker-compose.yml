services:
  app:
    build: .
    container_name: qa-cucumber-template
    working_dir: /e2e

    volumes:
      - ./cypress/reports:/e2e/cypress/reports
      - ./cypress/screenshots:/e2e/cypress/screenshots
      - ./cypress/videos:/e2e/cypress/videos
      - ./logs:/e2e/logs

    environment:
      - CI=true

    command: ["pnpm", "run", "cy:run"]

  report:
    build: .
    container_name: qa-cucumber-template-report
    working_dir: /e2e

    volumes:
      - ./cypress/reports:/e2e/cypress/reports

    ports:
      - "8080:8080"

    command: ["pnpm", "run", "report:serve"]
